name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Build the GUI app + native installers for every platform.
  gui:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # Intel
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils file

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Make the git tag the single source of truth for the version, so bundle
      # (installer) filenames and the app version always match the release tag.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          echo "Setting release version to $VERSION"
          tmp=$(mktemp)
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json
          tmp=$(mktemp)
          jq --arg v "$VERSION" '.version = $v' package.json > "$tmp" && mv "$tmp" package.json
          perl -0777 -pi -e 's/(\[workspace\.package\][^\[]*?\bversion\s*=\s*")[^"]*/$1$ENV{VERSION}/' Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "pydev ${{ github.ref_name }}"
          releaseBody: "Download the installer for your OS below. See the README for CLI usage."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Also publish the portable, installer-free Windows executable. The
      # WebView2 runtime it relies on is preinstalled on modern Windows, so
      # this single .exe runs without any installation step.
      - name: Stage portable Windows exe
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cp target/release/pydev.exe pydev-portable-windows-x86_64.exe

      - name: Upload portable Windows exe to release
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: pydev-portable-windows-x86_64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build the standalone CLI binary and attach it to the same release.
  cli:
    needs: gui
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            asset: "pydev-cli-linux-x86_64"
          - platform: "windows-latest"
            asset: "pydev-cli-windows-x86_64.exe"
          - platform: "macos-latest"
            asset: "pydev-cli-macos-arm64"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          echo "Setting CLI version to $VERSION"
          perl -0777 -pi -e 's/(\[workspace\.package\][^\[]*?\bversion\s*=\s*")[^"]*/$1$ENV{VERSION}/' Cargo.toml

      - name: Build CLI
        run: cargo build --release -p pydev-cli

      - name: Stage binary
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp target/release/pydev-cli.exe "${{ matrix.asset }}"
          else
            cp target/release/pydev-cli "${{ matrix.asset }}"
          fi

      - name: Upload CLI to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: ${{ matrix.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
